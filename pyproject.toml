[project]
name = "jwtninja"
dynamic = ["version"]
description = "A simple and fully-typed auth library for Django Ninja based on PyJWT."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "DVF", email = "dvf@dvf.com" },
]
keywords = [
    "django",
    "ninja",
    "jwt",
    "authentication",
    "auth",
    "token",
    "json-web-token",
    "security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
]
dependencies = [
    "django>=5.2.16,<6.2",
    "django-ninja>=1.5.3,<2",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.14.2,<3",
    "pyjwt>=2.13,<3",
]

[project.optional-dependencies]
# Asymmetric algorithms (RS*, ES*, PS*, EdDSA) need PyJWT's cryptography extra.
crypto = [
    "pyjwt[crypto]>=2.13,<3",
]

[dependency-groups]
audit = [
    "pip-audit>=2.10.0,<3",
]
build = [
    "hatchling==1.32.0",
    "twine>=6.2.0,<8",
    "uv-dynamic-versioning==0.14.0",
]
dev = [
    "psycopg[binary]>=3.2.10,<4",
    "pyjwt[crypto]>=2.13,<3",
    "pytest-django>=4.11.0,<5",
    "pytest-freezer>=0.4.9,<1",
    "pytest-mock>=3.14.0,<4",
    "pytest>=9.0.3,<10",
    "pyrefly>=0.0.14,<1",
    "ruff>=0.16.2,<1",
]
docs = [
    "zensical>=0.0.54,<1",
]

[tool.ruff]
exclude = [
    ".git",
    ".github",
    ".venv",
    ".vscode",
    "migrations",
    "static_files",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "TID",  # flake8-tidy-imports
]
ignore = [
    "TID252",  # Prefer absolute imports over relative imports from parent modules
]

[project.urls]
Homepage = "https://github.com/dvf/jwt-ninja"
Repository = "https://github.com/dvf/jwt-ninja"
Documentation = "https://dvf.github.io/jwt-ninja/"
Changelog = "https://github.com/dvf/jwt-ninja/releases"

[tool.isort]
profile = "black"
filter_files = true

[tool.pyrefly]
# Config is in pyrefly.toml
# python-version = "3.12"

[build-system]
requires = ["hatchling==1.32.0", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["jwt_ninja"]
exclude = ["jwt_ninja/tests/**"]
core-metadata-version = "2.4"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"
style = "semver"
strict = true
