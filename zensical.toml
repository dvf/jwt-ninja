[project]
site_url = "https://dvf.github.io/jwt-ninja/"
site_name = "JWT Ninja"
site_description = "A session-backed, fully-typed authentication library for Django Ninja, powered by PyJWT."
site_author = "Daniel van Flymen"

copyright = "Copyright &copy; Daniel van Flymen"

repo_url = "https://github.com/dvf/jwt-ninja"
repo_name = "dvf/jwt-ninja"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Getting started" = "guide/getting-started.md" },
    { "Protecting your views" = "guide/protecting-views.md" },
    { "Refresh tokens" = "guide/refresh-tokens.md" },
    { "Sessions & devices" = "guide/sessions.md" },
    { "Custom claims" = "guide/custom-claims.md" },
    { "Custom authenticator" = "guide/custom-authenticator.md" },
    { "Deployment checklist" = "guide/deployment.md" },
    { "Upgrading" = "guide/upgrading.md" },
  ] },
  { "Reference" = [
    { "Endpoints" = "reference/endpoints.md" },
    { "Error codes" = "reference/error-codes.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
favicon = "assets/mark.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/shield-check"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/dvf/jwt-ninja"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/jwtninja/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
