name: Lint, type check, test, and build

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Locked quality and package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Verify and install the lock
        run: |
          uv lock --check
          uv sync --frozen --all-groups --all-extras
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Type check
        run: uv run --frozen pyrefly check
      - name: Test
        run: uv run --frozen pytest
      - name: Build distributions with locked tooling
        run: |
          rm -rf dist
          uv build --no-build-isolation --out-dir dist
          uv run --frozen --only-group build twine check --strict dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              tests = [name for name in archive.namelist() if name.startswith("jwt_ninja/tests/")]
          assert not tests, f"wheel contains tests: {tests}"
          PY
      - name: Upload checked distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django:
          - "==5.2.16"
          - ">=6.0,<6.1"
          - ">=6.1,<6.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install compatibility environment without changing the lock
        env:
          DJANGO_SPEC: ${{ matrix.django }}
        run: |
          uv venv --python "${{ matrix.python }}" .venv-compat
          uv pip install --python .venv-compat/bin/python \
            hatchling==1.32.0 uv-dynamic-versioning==0.14.0
          uv pip install --python .venv-compat/bin/python --no-build-isolation \
            ".[crypto]" "django${DJANGO_SPEC}" \
            "pytest>=9.0.3,<10" "pytest-django>=4.11,<5" \
            "pytest-freezer>=0.4.9,<1" "pytest-mock>=3.14,<4"
      - name: Run compatibility tests
        run: .venv-compat/bin/pytest

  postgres-security:
    name: PostgreSQL security and concurrency tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: jwtninja
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jwtninja"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_NINJA_TEST_POSTGRES: "1"
      POSTGRES_DB: jwtninja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --frozen --all-extras
      - name: Run full suite on PostgreSQL
        run: uv run --frozen pytest
