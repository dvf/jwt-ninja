name: PR label checks

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened, unlabeled]

permissions: {}

jobs:
  check-labels:
    name: Check version labels and migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          cat changed_files.txt
      - name: Require migration label when migrations changed
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          if ! grep -Eq '(^|/)migrations/' changed_files.txt; then
            echo 'No migrations detected.'
          elif jq -e '[.pull_request.labels[].name] | index("migration") != null' "$EVENT_PATH" >/dev/null; then
            echo 'Migration change has the required "migration" label.'
          else
            echo 'Migration changes require the exact "migration" label; a maintainer must apply it.' >&2
            exit 1
          fi
      - name: Require exactly one release label
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          if ! jq -e '
            [.pull_request.labels[].name
              | select(. == "breaking-change" or . == "feature" or . == "fix" or . == "maintenance")]
            | length == 1
          ' "$EVENT_PATH" >/dev/null; then
            echo 'Pull request must have one exact release label: breaking-change, feature, fix, or maintenance.' >&2
            exit 1
          fi
