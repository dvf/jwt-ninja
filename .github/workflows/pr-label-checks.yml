name: PR label checks

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened, unlabeled]

permissions: {}

jobs:
  check-labels:
    name: Check version labels and migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          cat changed_files.txt
      - name: Apply migration label when migrations changed
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if grep -Eq '(^|/)migrations/' changed_files.txt; then
            echo 'Migrations detected; applying the exact "migration" label.'
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/labels" \
              --field 'labels[]=migration' >/dev/null
          else
            echo "No migrations detected."
          fi
      - name: Explain fork migration labeling
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork pull requests are not mutated; maintainers apply the migration label when required.'
      - name: Require exactly one release label
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          if ! jq -e '
            [.pull_request.labels[].name
              | select(. == "breaking-change" or . == "feature" or . == "fix" or . == "maintenance")]
            | length == 1
          ' "$EVENT_PATH" >/dev/null; then
            echo 'Pull request must have one exact release label: breaking-change, feature, fix, or maintenance.' >&2
            exit 1
          fi
